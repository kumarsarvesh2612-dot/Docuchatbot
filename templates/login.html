<!DOCTYPE html>
<html lang="en">

<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>DocuChat-Login</title>
   <link rel="stylesheet" href="{{ url_for('static',filename='auth.css') }}">
</head>
</head>

<body>
   <div class="container">
      <div class="logo">Docu Chat</div>
      <p class="subtitle">AI-powerd Document Assistant</p>
      <h2>Wellcome Back</h2>

      <form action="/login" method="POST">
         <div class="input-box">
            <label>Email</label>
            <input type="email" name="email" placeholder="Enter your email" required>
            {% if email_error %}
            <small class="error">{{ email_error }}</small>
            {% endif %}
         </div>
         <div class="input-box">
            <label>Password</label>
            <input type="password" id="password" name="password" placeholder="Enter your password" required>
            {% if password_error %}
            <small class="error">{{ password_error }}</small>
            {% endif %}
            <button type="button" onclick="showPassword()">show</button>
            <script>
               function showPassword() {
                  let password = document.getElementById("password");
                  if (password.type === "password") {
                     password.type = "text";
                  }
                  else {
                     password.type = "password";
                  }
               }
            </script>
         </div>
         <div class="forgot">
            <a href="#">Forgot Password?</a>
         </div>
         <button type="submit">Login</button>
      </form>
      <p clas="bottom-text">Don't have an Account?<a href="/register">Create Acconter</a></p>

   </div>
</body>

</html>
